name: Deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: apiwatch-shivamkumar
  AZURE_RESOURCE_GROUP: apiwatch-rg
  PYTHON_VERSION: '3.11'

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: |
          pip install pytest pytest-asyncio httpx
          python -m pytest tests/ -v --tb=short

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

      - name: Build frontend with production backend URL
        working-directory: frontend
        env:
          VITE_API_URL: https://apiwatch-shivamkumar.azurewebsites.net
        run: npm run build

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Azure App Settings
        run: |
          az webapp config appsettings set \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              WEBSITE_STARTUP_TIME_LIMIT=600 \
              JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}"

      - name: Install production dependencies for deployment
        run: |
          pip install --target=./deploy-deps -r requirements.txt
          echo "Installed $(ls deploy-deps | wc -l) packages"

      - name: Create deployment package
        run: |
          mkdir deploy-package
          cp -r src requirements.txt runtime.txt startup.sh examples deploy-package/
          # Include pre-installed Python packages (CI is Linux x64 = same as Azure)
          cp -r deploy-deps deploy-package/packages
          # Include alembic for database migrations
          if [ -d alembic ]; then
            cp -r alembic alembic.ini deploy-package/ 2>/dev/null || true
          fi
          cp -r frontend/dist deploy-package/public
          cd deploy-package
          zip -r ../backend-deploy.zip .

      - name: Deploy to Azure Web App
        run: |
          az webapp deployment source config-zip \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --src backend-deploy.zip \
            --timeout 300

      - name: Test deployment
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 30
          for i in 1 2 3; do
            if curl -sf https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/health; then
              echo "✅ Backend is healthy!"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "❌ Health check failed after 3 attempts"
          exit 1

      - name: Logout from Azure
        run: az logout
        if: always()
