[project]
name = "api-watch"
version = "2.3.0"
description = "The fastest self-hosted API client with AI-powered intelligence"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
apiwatch = "src.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "E402", "E741", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]
"src/routes/__init__.py" = ["F401"]
